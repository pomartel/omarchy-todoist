name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json is well-formed JSON
        run: python3 -m json.tool manifest.json > /dev/null

      - name: Check manifest.json required fields
        run: |
          python3 - <<'EOF'
          import json, sys

          with open("manifest.json") as f:
              m = json.load(f)

          required = ["schemaVersion", "id", "name", "version", "author", "license", "kinds", "entryPoints"]
          missing = [k for k in required if k not in m]
          if missing:
              print(f"manifest.json missing required fields: {missing}")
              sys.exit(1)

          for kind in m["kinds"]:
              entry = m["entryPoints"].get({"bar-widget": "barWidget"}.get(kind, kind))
              if entry is None:
                  print(f"No entryPoints entry for kind '{kind}'")
                  sys.exit(1)
              import os
              if not os.path.isfile(entry):
                  print(f"entryPoints target '{entry}' does not exist")
                  sys.exit(1)

          print("manifest.json OK:", m["id"], m["version"])
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Qt 6 validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6 qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript

      - name: Parse QML syntax
        run: |
          for f in *.qml omatasks/ui/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$f" > /dev/null
          done

      - name: Run regression tests
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Confirm README references match manifest.json id
        run: |
          id=$(python3 -c "import json; print(json.load(open('manifest.json'))['id'])")
          grep -q "$id" README.md || { echo "README.md doesn't mention plugin id $id"; exit 1; }
